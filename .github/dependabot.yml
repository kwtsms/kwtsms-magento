version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/src/SmsIntegration"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    # 2026-11-17 12:01 +03: magento/* live on repo.magento.com (needs auth keys), so every weekly run failed with
    # "could not be found in any version"; their >=100.0.0 range is our compatibility policy, not something to bump.
    ignore:
      - dependency-name: "magento/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
    # 2026-11-25 10:37 +03: init and analyze must move together (CodeQL refuses mixed versions; PRs 13+14 failed), repo sweep
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"
